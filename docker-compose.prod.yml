services:
  ml-api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - MODEL_PATH=${MODEL_PATH:-/app/models/iforest-v1/model.joblib}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --log-level ${LOG_LEVEL:-info}
    restart: unless-stopped
